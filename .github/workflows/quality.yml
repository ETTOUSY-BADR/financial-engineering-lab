name: quantitative-research-quality

on:
  push:
  pull_request:

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research environment
        run: python -m pip install -r requirements.txt

      - name: Run mathematical invariant tests
        run: python -m unittest discover -s tests -v

      - name: Reproduce SPX surface from immutable snapshot
        run: python projects/volatility_surface/run_research.py

      - name: Execute and validate the empirical audit notebook
        run: python scripts/execute_notebooks.py notebooks/07_spx_surface_heston_validation.ipynb
